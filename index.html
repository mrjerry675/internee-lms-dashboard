<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internee.pk LMS Dashboard</title>
<meta name="description" content="Interactive prototype of the redesigned Internee.pk LMS dashboard: course progress tracking, personalised recommendations and a dark/light mode switch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply theme before first paint: ?theme= wins, then saved choice, then OS preference.
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    var saved = null;
    try { saved = localStorage.getItem('lms-theme'); } catch (e) {}
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = p || saved || (dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    --violet: #5B3DF5; --lime: #C6F432; --ink: #0F0E1A; --paper: #F7F6F2; --coral: #FF6B4A;
    --bg: #F7F6F2; --surface: #FFFFFF; --surface-2: #F3F1EC; --text: #0F0E1A; --muted: #67645E;
    --border: #E6E3DC; --brand: #5B3DF5; --brand-soft: #F1EEFF; --brand-text: #4628D8;
    --track: #ECEAE4; --success: #1FA971; --shadow: 0 1px 2px rgba(15,14,26,.04), 0 8px 24px rgba(15,14,26,.06);
    --radius: 20px;
  }
  :root[data-theme="dark"] {
    --bg: #0B0A14; --surface: #15141F; --surface-2: #1C1B29; --text: #F7F6F2; --muted: #A09CB0;
    --border: #262438; --brand: #7E66F8; --brand-soft: #221B4D; --brand-text: #C5B8FF;
    --track: #262438; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font: 400 15px/1.5 Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; transition: background .35s, color .35s; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .h { font-family: 'Space Grotesk', Inter, sans-serif; letter-spacing: -0.02em; }
  .muted { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

  /* Shell */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; padding: 28px 18px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 28px; transition: background .35s, border-color .35s; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px; font: 700 21px 'Space Grotesk'; letter-spacing: -0.04em; }
  .logo b { color: var(--brand); font-weight: 700; }
  :root[data-theme="dark"] .logo b { color: var(--lime); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 500; transition: background .2s, color .2s; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.on { background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
  .nav .count { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--lime); color: var(--ink); border-radius: 999px; padding: 1px 8px; }
  .goal { margin-top: auto; background: var(--ink); color: var(--paper); border-radius: 18px; padding: 18px; position: relative; overflow: hidden; }
  :root[data-theme="dark"] .goal { background: var(--brand-soft); }
  .goal::after { content: ""; position: absolute; right: -30px; top: -30px; width: 100px; height: 100px; border-radius: 50%; background: var(--violet); opacity: .9; }
  .goal > * { position: relative; z-index: 1; }
  .goal .bar { margin-top: 12px; background: rgba(255,255,255,.14); }
  .goal .bar i { background: var(--lime); }

  .main { padding: 28px 40px 48px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .top h1 { font-size: 30px; line-height: 1.15; }
  .top p { margin-top: 4px; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; width: 280px; color: var(--muted); transition: background .35s, border-color .35s; }
  .search input { border: 0; outline: 0; background: none; color: var(--text); font: inherit; width: 100%; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); position: relative; transition: background .35s, border-color .35s; }
  .icon-btn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); border: 2px solid var(--surface); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; font: 700 16px 'Space Grotesk'; flex: none; }

  /* Theme switch */
  .switch { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); position: relative; transition: background .35s, border-color .35s; }
  .switch span { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1; color: var(--muted); transition: color .3s; }
  .switch::before { content: ""; position: absolute; left: 4px; top: 4px; width: 36px; height: 36px; border-radius: 50%; background: var(--violet); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
  :root[data-theme="dark"] .switch::before { transform: translateX(40px); background: var(--lime); }
  :root[data-theme="light"] .switch .sun, :root[data-theme="dark"] .switch .moon { color: #fff; }
  :root[data-theme="dark"] .switch .moon { color: var(--ink); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); transition: background .35s, border-color .35s, transform .2s, box-shadow .2s; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .sec-h h2 { font-size: 21px; }
  .link { color: var(--brand-text); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--brand); transition: width 1s cubic-bezier(.2,.8,.2,1); }

  .stats { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .stat { display: flex; flex-direction: column; gap: 6px; }
  .stat .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 8px; }
  .ic-coral { background: #FFE6DF; color: #C7432A; } .ic-violet { background: var(--brand-soft); color: var(--brand-text); } .ic-lime { background: #F3FDD0; color: #5C7410; }
  :root[data-theme="dark"] .ic-coral { background: #3A1E19; color: #FFAA96; } :root[data-theme="dark"] .ic-lime { background: #283010; color: var(--lime); }
  :root[data-theme="dark"] .thumb { box-shadow: inset 0 0 0 1px var(--border); }
  .stat .v { font: 700 30px/1.1 'Space Grotesk'; letter-spacing: -0.03em; }
  .stat .d { font-size: 13px; color: var(--success); font-weight: 600; }
  .overall { flex-direction: row; align-items: center; gap: 22px; background: var(--violet); color: #fff; border-color: transparent; position: relative; overflow: hidden; }
  .overall::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .overall .muted { color: #E2DCFF; }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .t { stroke: rgba(255,255,255,.18); }
  .ring .p { stroke: var(--lime); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px 'Space Grotesk'; }

  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 20px; margin-bottom: 28px; }
  .courses { display: flex; flex-direction: column; gap: 14px; }
  .course { display: grid; grid-template-columns: 76px minmax(0,1fr) auto; gap: 18px; align-items: center; cursor: pointer; }
  .course:hover, .rec:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(15,14,26,.05), 0 16px 32px rgba(15,14,26,.10); }
  .thumb { width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; position: relative; overflow: hidden; }
  .thumb svg.i { width: 30px; height: 30px; }
  .course h3 { font-size: 17px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg.i { width: 15px; height: 15px; }
  .prog { display: flex; align-items: center; gap: 12px; }
  .prog .bar { flex: 1; }
  .prog b { font: 700 14px 'Space Grotesk'; min-width: 38px; text-align: right; }
  .next { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .next b { color: var(--text); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: #4628D8; }
  :root[data-theme="dark"] .btn.primary:hover { background: #9580FA; }
  .btn.accent { background: var(--lime); color: var(--ink); }
  .btn.ghost { border: 1.5px solid var(--border); }
  .btn.ghost:hover { border-color: var(--text); }
  .btn svg.i { width: 17px; height: 17px; }

  .side-col { display: flex; flex-direction: column; gap: 20px; }
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 150px; margin-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; position: relative; }
  .chart .b { width: 100%; max-width: 30px; border-radius: 9px; background: var(--brand-soft); height: 0; transition: height .9s cubic-bezier(.2,.8,.2,1), background .2s; }
  .chart .col.today .b { background: var(--brand); }
  .chart .col:hover .b { background: var(--lime); }
  .chart .col small { font-size: 12px; color: var(--muted); }
  .chart .tip { position: absolute; bottom: calc(var(--h) + 30px); background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; opacity: 0; transform: translateY(4px); transition: .15s; pointer-events: none; white-space: nowrap; }
  :root[data-theme="dark"] .chart .tip { background: var(--lime); color: var(--ink); }
  .chart .col:hover .tip { opacity: 1; transform: none; }
  .total { display: flex; align-items: baseline; gap: 8px; }
  .total b { font: 700 28px 'Space Grotesk'; letter-spacing: -0.03em; }
  .dl { display: flex; flex-direction: column; gap: 4px; }
  .dl li { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .dl li:last-child { border: 0; }
  .date { width: 48px; height: 52px; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
  .date b { font: 700 18px/1 'Space Grotesk'; }
  .date small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .dl .t { font-weight: 600; font-size: 14px; }
  .dl .s { font-size: 12px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .pill.urgent { background: #FFE6DF; color: #C7432A; }
  :root[data-theme="dark"] .pill.urgent { background: #3A1E19; color: #FFAA96; }
  .dl .pill { margin-left: auto; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface); transition: .2s; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .recs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; }
  .rec { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .cover { height: 132px; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 16px; }
  .cover .blob { position: absolute; border-radius: 50%; }
  .match { position: relative; z-index: 1; background: rgba(15,14,26,.75); color: #fff; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(6px); }
  .match i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
  .save { position: absolute; top: 14px; right: 14px; z-index: 1; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--ink); display: grid; place-items: center; transition: transform .15s; }
  .save:hover { transform: scale(1.08); }
  .save.on svg.i { fill: var(--violet); stroke: var(--violet); }
  .rec .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .why { font-size: 12px; font-weight: 600; color: var(--brand-text); display: flex; align-items: center; gap: 6px; }
  .why svg.i { width: 14px; height: 14px; }
  .rec h3 { font-size: 18px; line-height: 1.25; }
  .rec .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; }
  .stars { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .stars svg.i { width: 15px; height: 15px; fill: #F5A524; stroke: #F5A524; }
  .empty { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--muted); }

  /* Course detail */
  .back { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--muted); margin-bottom: 18px; }
  .back:hover { color: var(--text); }
  .hero { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 28px; align-items: center; padding: 28px; position: relative; overflow: hidden; }
  .hero h1 { font-size: 34px; line-height: 1.1; margin: 6px 0 10px; }
  .hero .ring .t { stroke: var(--track); }
  .hero .ring .p { stroke: var(--brand); }
  .hero .ring b { color: var(--text); }
  .eyebrow { font: 700 12px 'Space Grotesk'; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-text); }
  .detail { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; margin-top: 20px; }
  .mods { display: flex; flex-direction: column; }
  .mod { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--border); }
  .mod:last-child { border: 0; }
  .mod .st { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .mod .st svg.i { width: 17px; height: 17px; }
  .mod.done .st { background: var(--success); color: #fff; }
  .mod.now .st { background: var(--brand); color: #fff; box-shadow: 0 0 0 5px var(--brand-soft); }
  .mod.lock .st { background: var(--surface-2); color: var(--muted); }
  .mod.lock .t { color: var(--muted); }
  .mod .t { font-weight: 600; }
  .mod .s { font-size: 13px; color: var(--muted); }
  .mod .r { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .kv { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .kv:last-of-type { border: 0; }
  .kv b { font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; }
  :root[data-theme="dark"] .toast { background: var(--lime); color: var(--ink); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast svg.i { width: 18px; height: 18px; }
  .view { animation: in .35s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 1280px) { .stats { grid-template-columns: 1fr 1fr; } .grid2, .detail { grid-template-columns: 1fr; } .side-col { display: grid; grid-template-columns: 1fr 1fr; } }
  @media (max-width: 1000px) { .recs { grid-template-columns: 1fr 1fr; } .search { display: none; } }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { position: sticky; z-index: 10; height: auto; flex-direction: row; align-items: center; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--border); gap: 8px; overflow-x: auto; }
    .side .nav { flex-direction: row; } .nav a span.lbl, .nav .count, .goal { display: none; } .nav a { padding: 10px; }
    .logo { padding: 0 6px 0 0; } .logo span { display: none; }
    .main { padding: 20px 16px 40px; }
    .top { flex-wrap: wrap; } .top > div:first-child { flex: 1 1 100%; } .top h1 { font-size: 24px; }
    .side-col, .recs { grid-template-columns: 1fr; }
    .course { grid-template-columns: 56px minmax(0,1fr); } .course .btn { grid-column: 1 / -1; } .thumb { width: 56px; height: 56px; }
    .hero { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) { .stats { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6l-5.4 2.9 1.2-6-4.5-4.2 6.1-.7z"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/></symbol>
  <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.8 7-6.8 0-3.5-2.4-5.6-4-8.2-.6 2-1.6 3-3 3.5C12.5 7 11 4.5 8.5 2.5 8.6 6 5 8.6 5 13.6 5 18.8 8 22 12 22z"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M18 14a6 6 0 0 1 4 7"/></symbol>
  <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15v2M11 11v6M15 7v10M19 12v5"/></symbol>
  <symbol id="mega" viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 5V5L7 10H4a1 1 0 0 0-1 1zM17 8a5 5 0 0 1 0 8M20 5a9 9 0 0 1 0 14"/></symbol>
  <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="access" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5l-3 6M12 15l3 6"/></symbol>
</svg>

<div class="app">
  <aside class="side">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="24.96" fill="#5B3DF5"/><rect x="24" y="40.32" width="20.16" height="38.4" rx="10.08" fill="#fff"/><circle cx="59.52" cy="27.84" r="12.48" fill="#C6F432"/></svg>
      <span>internee<b>.pk</b></span>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#/" class="on" data-nav="home"><svg class="i"><use href="#home"/></svg><span class="lbl">Dashboard</span></a>
      <a href="#courses" data-nav="courses"><svg class="i"><use href="#book"/></svg><span class="lbl">My courses</span><span class="count">4</span></a>
      <a href="#recommended" data-nav="recs"><svg class="i"><use href="#star"/></svg><span class="lbl">For you</span></a>
      <a href="#deadlines" data-nav="cal"><svg class="i"><use href="#cal"/></svg><span class="lbl">Schedule</span></a>
      <a href="#/" data-soon><svg class="i"><use href="#award"/></svg><span class="lbl">Certificates</span></a>
      <a href="#/" data-soon><svg class="i"><use href="#sliders"/></svg><span class="lbl">Settings</span></a>
    </nav>
    <div class="goal">
      <div class="h" style="font-size:16px;font-weight:700">Weekly goal</div>
      <div style="font-size:13px;opacity:.75;margin-top:2px">12.5 of 15 hours</div>
      <div class="bar"><i data-w="83"></i></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><svg class="i"><use href="#check"/></svg><span></span></div>

<script>
const COURSES = [
  { id: 'ui-ux', title: 'UI/UX Design Fundamentals', cat: 'Design', icon: 'pen', bg: '#5B3DF5', fg: '#C6F432', done: 18, total: 25, mins: '6h 10m left', next: 'Lesson 19 · Prototyping in Figma', mentor: 'Hira Malik',
    mods: [['Design thinking', 'done'], ['Wireframing', 'done'], ['Visual hierarchy', 'done'], ['Prototyping in Figma', 'now'], ['Usability testing', 'lock'], ['Capstone: redesign an app', 'lock']] },
  { id: 'react', title: 'React for Beginners', cat: 'Development', icon: 'code', bg: '#0F0E1A', fg: '#C6F432', done: 9, total: 20, mins: '9h 30m left', next: 'Lesson 10 · State & hooks', mentor: 'Usman Tariq',
    mods: [['JSX & components', 'done'], ['Props', 'done'], ['State & hooks', 'now'], ['Effects & data fetching', 'lock'], ['Routing', 'lock'], ['Capstone: task app', 'lock']] },
  { id: 'python', title: 'Python for Data Science', cat: 'Data', icon: 'chart', bg: '#C6F432', fg: '#0F0E1A', done: 22, total: 25, mins: '1h 45m left', next: 'Lesson 23 · Visualising with Matplotlib', mentor: 'Ayesha Noor',
    mods: [['Python basics', 'done'], ['NumPy', 'done'], ['Pandas', 'done'], ['Cleaning data', 'done'], ['Visualisation', 'now'], ['Capstone: data story', 'lock']] },
  { id: 'marketing', title: 'Digital Marketing Essentials', cat: 'Marketing', icon: 'mega', bg: '#FF6B4A', fg: '#0F0E1A', done: 3, total: 15, mins: '8h 20m left', next: 'Lesson 4 · Writing for social', mentor: 'Bilal Ahmed',
    mods: [['Marketing funnels', 'done'], ['Brand voice', 'now'], ['Writing for social', 'lock'], ['Paid ads basics', 'lock'], ['Analytics', 'lock']] },
];
const RECS = [
  { title: 'Figma Auto Layout Masterclass', cat: 'Design', why: 'Next step after UI/UX Fundamentals', match: 96, len: '2h 40m', rating: 4.9, learners: '3.2k', c: ['#5B3DF5', '#C6F432', '#7E66F8'] },
  { title: 'Accessibility for Designers', cat: 'Design', why: 'Matches your goal: Product Designer', match: 91, len: '1h 55m', rating: 4.8, learners: '1.8k', c: ['#0F0E1A', '#5B3DF5', '#C6F432'] },
  { title: 'TypeScript Essentials', cat: 'Development', why: 'Pairs well with React for Beginners', match: 88, len: '3h 10m', rating: 4.7, learners: '2.4k', c: ['#C6F432', '#0F0E1A', '#5B3DF5'] },
  { title: 'SQL for Analysts', cat: 'Data', why: 'Popular with your Python cohort', match: 84, len: '2h 20m', rating: 4.8, learners: '4.1k', c: ['#1FA971', '#C6F432', '#0F0E1A'] },
  { title: 'Personal Branding on LinkedIn', cat: 'Marketing', why: 'Trending with interns this week', match: 79, len: '1h 10m', rating: 4.6, learners: '5.6k', c: ['#FF6B4A', '#0F0E1A', '#F7F6F2'] },
  { title: 'Design Systems 101', cat: 'Design', why: 'Because you saved “UI Kits”', match: 86, len: '2h 05m', rating: 4.7, learners: '2.0k', c: ['#351DAE', '#FF6B4A', '#C6F432'] },
];
const WEEK = [['Mon', 1.5], ['Tue', 2], ['Wed', 0.5], ['Thu', 3], ['Fri', 2.5], ['Sat', 1], ['Sun', 2]];
const TODAY = 4; // Fri
const DEADLINES = [
  ['27', 'Oct', 'Wireframe assignment', 'UI/UX Design Fundamentals', 'Tomorrow', true],
  ['29', 'Oct', 'Quiz 3: React hooks', 'React for Beginners', '3 days'],
  ['31', 'Oct', 'Capstone draft', 'Python for Data Science', '5 days'],
];
const saved = new Set();
let filter = 'All';

const ic = (id, extra) => `<svg class="i" ${extra || ''}><use href="#${id}"/></svg>`;
const pct = c => Math.round(c.done / c.total * 100);
const ring = (p, size) => { const r = 42, L = 2 * Math.PI * r; return `<div class="ring" style="${size ? `width:${size}px;height:${size}px` : ''}"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="${r}"/><circle class="p" cx="50" cy="50" r="${r}" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-off="${L * (1 - p / 100)}"/></svg><b>${p}%</b></div>`; };
const overall = Math.round(COURSES.reduce((a, c) => a + c.done, 0) / COURSES.reduce((a, c) => a + c.total, 0) * 100);

function dashboard() {
  const recs = RECS.filter(r => filter === 'All' || r.cat === filter).slice(0, 3);
  return `<div class="view">
  <div class="top">
    <div><h1 class="h">Good morning, Sara 👋</h1><p class="muted">You're 2 lessons away from this week's goal. Keep the streak going!</p></div>
    <label class="search">${ic('search')}<input placeholder="Search courses, lessons…" aria-label="Search"></label>
    ${themeSwitch()}
    <button class="icon-btn" aria-label="Notifications">${ic('bell')}<span class="dot"></span></button>
    <div class="avatar" aria-label="Sara's profile">S</div>
  </div>

  <section class="stats" aria-label="Learning summary">
    <div class="card stat overall">${ring(overall)}<div><div class="h" style="font-size:20px;font-weight:700">Overall progress</div><div class="muted" style="font-size:14px;margin-top:4px">${COURSES.reduce((a, c) => a + c.done, 0)} of ${COURSES.reduce((a, c) => a + c.total, 0)} lessons across 4 courses</div><div style="margin-top:12px;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600">${ic('trend', 'style="width:15px;height:15px"')} +8% this week</div></div></div>
    <div class="card stat"><div class="ic ic-coral">${ic('flame')}</div><span class="muted">Learning streak</span><span class="v">9 days</span><span class="d">Personal best!</span></div>
    <div class="card stat"><div class="ic ic-violet">${ic('clock')}</div><span class="muted">Hours this week</span><span class="v">12.5h</span><span class="d">+2.5h vs last week</span></div>
    <div class="card stat"><div class="ic ic-lime">${ic('award')}</div><span class="muted">Certificates</span><span class="v">3</span><span class="d" style="color:var(--muted)">1 more at 100% Python</span></div>
  </section>

  <div class="grid2">
    <section id="courses">
      <div class="sec-h"><h2 class="h">Continue learning</h2><button class="link">View all ${ic('right', 'style="width:16px;height:16px"')}</button></div>
      <div class="courses">${COURSES.map(c => `
        <article class="card course" data-open="${c.id}" tabindex="0" aria-label="Open ${c.title}">
          <div class="thumb" style="background:${c.bg};color:${c.fg}">${ic(c.icon)}</div>
          <div style="min-width:0">
            <h3 class="h">${c.title}</h3>
            <div class="meta"><span>${ic('book')}${c.done}/${c.total} lessons</span><span>${ic('clock')}${c.mins}</span><span>${c.cat}</span></div>
            <div class="prog"><div class="bar"><i data-w="${pct(c)}"></i></div><b>${pct(c)}%</b></div>
            <div class="next">Up next: <b>${c.next}</b></div>
          </div>
          <button class="btn primary" data-open="${c.id}">${ic('play')}Continue</button>
        </article>`).join('')}
      </div>
    </section>
    <div class="side-col">
      <section class="card">
        <div class="sec-h" style="margin-bottom:4px"><h2 class="h" style="font-size:18px">Weekly activity</h2><span class="muted" style="font-size:13px">Oct 20 – 26</span></div>
        <div class="total"><b>12.5h</b><span class="muted" style="font-size:13px">learned · goal 15h</span></div>
        <div class="chart">${WEEK.map((d, i) => `<div class="col ${i === TODAY ? 'today' : ''}" style="--h:${d[1] / 3 * 110}px"><span class="tip">${d[1]}h</span><div class="b" data-h="${d[1] / 3 * 110}"></div><small>${d[0]}</small></div>`).join('')}</div>
      </section>
      <section class="card" id="deadlines">
        <div class="sec-h" style="margin-bottom:4px"><h2 class="h" style="font-size:18px">Upcoming deadlines</h2></div>
        <ul class="dl">${DEADLINES.map(d => `<li><div class="date"><b>${d[0]}</b><small>${d[1]}</small></div><div><div class="t">${d[2]}</div><div class="s">${d[3]}</div></div><span class="pill ${d[5] ? 'urgent' : ''}" style="${d[5] ? '' : 'background:var(--surface-2);color:var(--muted)'}">${d[4]}</span></li>`).join('')}</ul>
      </section>
    </div>
  </div>

  <section id="recommended">
    <div class="sec-h"><div><h2 class="h">Recommended for you</h2><p class="muted" style="font-size:14px;margin-top:2px">Picked from your goals, progress and what your cohort loves.</p></div>
      <div class="chips" role="tablist">${['All', 'Design', 'Development', 'Data', 'Marketing'].map(f => `<button class="chip ${f === filter ? 'on' : ''}" data-filter="${f}" role="tab" aria-selected="${f === filter}">${f}</button>`).join('')}</div></div>
    <div class="recs">${recs.length ? recs.map(recCard).join('') : `<div class="card empty">No picks in this category yet — try another filter.</div>`}</div>
  </section>
  </div>`;
}

function recCard(r) {
  const i = RECS.indexOf(r);
  return `<article class="card rec">
    <div class="cover" style="background:${r.c[0]}">
      <span class="blob" style="width:150px;height:150px;right:-30px;top:-50px;background:${r.c[1]}"></span>
      <span class="blob" style="width:60px;height:60px;right:110px;bottom:-18px;background:${r.c[2]}"></span>
      <span class="match"><i></i>${r.match}% match</span>
      <button class="save ${saved.has(i) ? 'on' : ''}" data-save="${i}" aria-label="Save ${r.title}" aria-pressed="${saved.has(i)}">${ic('bookmark', 'style="width:17px;height:17px"')}</button>
    </div>
    <div class="body">
      <span class="why">${ic('target')}${r.why}</span>
      <h3 class="h">${r.title}</h3>
      <div class="meta" style="margin:0"><span>${ic('clock')}${r.len}</span><span>${ic('users')}${r.learners} learners</span></div>
      <div class="foot"><span class="stars">${ic('star')}${r.rating}</span><button class="btn accent" data-enroll="${i}">Enroll free</button></div>
    </div></article>`;
}

function courseView(c) {
  const p = pct(c);
  return `<div class="view">
  <div class="top" style="margin-bottom:12px"><button class="back" data-go="/">${ic('left')}Back to dashboard</button><div style="margin-left:auto;display:flex;gap:16px;align-items:center">${themeSwitch()}<div class="avatar">S</div></div></div>
  <section class="card hero">
    <div><span class="eyebrow">${c.cat} · Mentor: ${c.mentor}</span><h1 class="h">${c.title}</h1>
      <div class="meta"><span>${ic('book')}${c.done}/${c.total} lessons</span><span>${ic('clock')}${c.mins}</span><span>${ic('award')}Certificate on completion</span></div>
      <div class="prog" style="max-width:520px;margin:6px 0 18px"><div class="bar" style="height:10px"><i data-w="${p}"></i></div><b>${p}%</b></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-toast="Resuming: ${c.next}">${ic('play')}Resume: ${c.next.split(' · ')[1]}</button><button class="btn ghost" data-toast="Notes opened">Course notes</button></div>
    </div>
    ${ring(p, 150)}
  </section>
  <div class="detail">
    <section class="card"><div class="sec-h"><h2 class="h" style="font-size:19px">Modules</h2><span class="muted" style="font-size:13px">${c.mods.filter(m => m[1] === 'done').length} of ${c.mods.length} complete</span></div>
      <div class="mods">${c.mods.map((m, i) => `<div class="mod ${m[1]}"><span class="st">${ic(m[1] === 'done' ? 'check' : m[1] === 'now' ? 'play' : 'lock')}</span><div><div class="t">${i + 1}. ${m[0]}</div><div class="s">${m[1] === 'done' ? 'Completed' : m[1] === 'now' ? 'In progress — pick up where you left off' : 'Unlocks after the previous module'}</div></div><span class="r">${4 + (i % 3)} lessons</span></div>`).join('')}</div>
    </section>
    <div class="side-col" style="display:flex">
      <section class="card"><h2 class="h" style="font-size:18px;margin-bottom:8px">Your stats</h2>
        <div class="kv"><span class="muted">Quiz average</span><b>87%</b></div><div class="kv"><span class="muted">Time spent</span><b>14h 20m</b></div><div class="kv"><span class="muted">Assignments</span><b>5 / 6 submitted</b></div><div class="kv"><span class="muted">Cohort rank</span><b>Top 15%</b></div>
      </section>
      <section class="card"><h2 class="h" style="font-size:18px;margin-bottom:12px">Recommended next</h2>${recCard(RECS[c.cat === 'Design' ? 0 : c.cat === 'Development' ? 2 : c.cat === 'Data' ? 3 : 4]).replace('class="card rec"', 'class="rec" style="border:1px solid var(--border);border-radius:16px"')}</section>
    </div>
  </div></div>`;
}

const themeSwitch = () => `<button class="switch" data-theme-toggle aria-label="Switch between light and dark mode" title="Light / dark mode"><span class="sun">${ic('sun', 'style="width:18px;height:18px"')}</span><span class="moon">${ic('moon', 'style="width:18px;height:18px"')}</span></button>`;

function animate() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('[data-w]').forEach(e => e.style.width = e.dataset.w + '%');
    document.querySelectorAll('[data-off]').forEach(e => e.style.strokeDashoffset = e.dataset.off);
    document.querySelectorAll('[data-h]').forEach(e => e.style.height = e.dataset.h + 'px');
  }));
}

function render() {
  const m = location.hash.match(/^#\/course\/([\w-]+)/);
  const c = m && COURSES.find(x => x.id === m[1]);
  document.getElementById('main').innerHTML = c ? courseView(c) : dashboard();
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', c ? a.dataset.nav === 'courses' : a.dataset.nav === 'home'));
  if (!/^#(courses|recommended|deadlines)$/.test(location.hash)) window.scrollTo(0, 0);
  animate();
}

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.querySelector('span').textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-theme-toggle],[data-open],[data-go],[data-filter],[data-save],[data-enroll],[data-toast],[data-soon],[data-nav]');
  if (!t) return;
  if (t.matches('[data-theme-toggle]')) {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('lms-theme', next); } catch (err) {}
    toast(next === 'dark' ? 'Dark mode on' : 'Light mode on');
  } else if (t.dataset.open) { e.stopPropagation(); location.hash = '#/course/' + t.dataset.open; }
  else if (t.dataset.go) location.hash = '#' + t.dataset.go;
  else if (t.dataset.filter) { filter = t.dataset.filter; const y = scrollY; render(); scrollTo(0, y); }
  else if (t.dataset.save) { const i = +t.dataset.save; saved.has(i) ? saved.delete(i) : saved.add(i); t.classList.toggle('on'); t.setAttribute('aria-pressed', saved.has(i)); toast(saved.has(i) ? 'Saved to your list' : 'Removed from saved'); }
  else if (t.dataset.enroll) toast('Enrolled in ' + RECS[+t.dataset.enroll].title);
  else if (t.dataset.toast) toast(t.dataset.toast);
  else if (t.matches('[data-soon]')) { e.preventDefault(); toast('Coming soon in the next sprint'); }
  else if (t.dataset.nav && t.dataset.nav !== 'home' && /^#\/course/.test(location.hash)) { e.preventDefault(); location.hash = '#/'; setTimeout(() => document.querySelector(t.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }), 50); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('article[data-open]')) location.hash = '#/course/' + e.target.dataset.open; });
window.addEventListener('hashchange', () => { if (/^#\/|^$/.test(location.hash) || location.hash === '') render(); });
if (location.hash === '' || location.hash.startsWith('#/')) render(); else { render(); }
</script>
</body>
